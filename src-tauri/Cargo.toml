[package]
name = "deepseek-harness-desktop"
version = "0.1.0"
description = "DeepSeek Harness 桌面端 (Tauri 2)"
authors = ["DeepSeek Harness Desktop"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
# tauri-build and tauri-utils must stay on the same (3-arg external_binaries) generation,
# otherwise the build script fails with a signature mismatch. Let tauri-build float to the
# latest 2.x and pin tauri-utils to the matching sync release.
tauri-build = { version = "2" }
tauri-utils = { version = "=2.9.3" }

[dependencies]
tauri = { version = "=2.2.5", features = ["tray-icon"] }
tauri-plugin-shell = "=2.2.2"
tauri-plugin-updater = "=2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
rand = "0.8"
base64 = "0.22"
keyring = "3"
dirs = "5"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
tokio-util = "0.7"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
# default features nothing special
default = []
