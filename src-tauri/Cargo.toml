[package]
name = "deepseek-harness-desktop"
version = "0.1.0"
description = "DeepSeek Harness 桌面端 (Tauri 2)"
authors = ["DeepSeek Harness Desktop"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
# The WHOLE Tauri stack floats to the latest coherent 2.x release (pinned/frozen by the
# committed Cargo.lock). We deliberately do NOT pin individual internal crates: Tauri
# publishes tauri, tauri-build, tauri-utils, tauri-runtime, tauri-runtime-wry,
# tauri-macros, tauri-codegen together each release, and letting them all float to the
# newest 2.x yields a mutually-consistent set (the same one Tauri's own CI validates).
# Pinning any single internal crate to an older version is what produced every
# version-drift compile error (external_binaries arg-count mismatch, WebviewDispatch
# trait mismatches, webkit2gtk conflicts).
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
rand = "0.8"
base64 = "0.22"
keyring = "3"
dirs = "5"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"
tokio-util = "0.7"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
# default features nothing special
default = []
