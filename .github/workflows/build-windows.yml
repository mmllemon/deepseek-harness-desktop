name: Build Windows (Tauri 2 + Node22 sidecar Tier 2)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Cancel any in-progress run for the same ref when a new one starts. Without this,
# a burst of pushes previously left 3+ jobs stuck on the runner for hours
# (transient runner/cache glitches that block forever instead of failing fast).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Force non-interactive tooling (pnpm never prompts for build-script approval, etc.).
env:
  CI: "true"

jobs:
  build-windows:
    runs-on: windows-latest
    # Hard cap so a hung step fails in ~2h instead of burning the full 6h runner slot.
    timeout-minutes: 120
    # All `run` steps execute under the short path D:\wb so that the deepest
    # pnpm virtual-store paths (e.g. @mistralai/mistralai/esm/models/operations/...)
    # stay under Windows' MAX_PATH (260) when NSIS' `File /r` reads them.
    # Without this, `makensis` aborts with "failed opening file" on long paths.
    defaults:
      run:
        working-directory: D:\wb

    steps:
      - name: Checkout (desktop repo)
        uses: actions/checkout@v4

      - name: Relocate source to short path D:\wb
        shell: cmd
        working-directory: D:\a
        run: |
          if exist D:\wb rmdir /s /q D:\wb
          robocopy "%GITHUB_WORKSPACE%" "D:\wb" /E /XD .git /NFL /NDL /NJH /NJS /NP || ver >nul

      # Stamp the current CI run id into UPSTREAM.lock.json for traceability
      # (the file's `ciRunId` placeholder; not committed, used only during the run).
      - name: Stamp CI run id into lock
        shell: pwsh
        run: |
          $lock = "UPSTREAM.lock.json"
          (Get-Content $lock -Raw) -replace '"ciRunId":\s*"[^"]*"', ('"ciRunId": "' + $env:GITHUB_RUN_ID + '"') | Set-Content $lock
          Write-Host "stamped ciRunId = $env:GITHUB_RUN_ID"

      - name: Setup pnpm 11.7.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: D:\wb\src-tauri

      # ---- Pin & clone upstream deepseek-harness at the locked SHA ----
      # Single source of truth = UPSTREAM.lock.json. CI 不会使用未锁定的上游提交。
      - name: Pin & clone upstream harness
        shell: pwsh
        run: |
          $lock = Get-Content UPSTREAM.lock.json -Raw | ConvertFrom-Json
          $sha  = $lock.harness.sha
          $repo = $lock.harness.repo
          if ($sha -like '*<*') { Write-Error "UPSTREAM.lock.json 的 sha 仍为占位符，请先填入真实提交号"; exit 1 }
          Write-Host "Cloning $repo @ $sha"
          git clone --no-checkout "https://github.com/$repo.git" deepseek-harness
          git -C deepseek-harness checkout $sha

      # NOTE: We deliberately do NOT cache the harness build outputs
      # (apps/cli/lib, apps/web/dist, packages/**/lib). The `Build harness`
      # step always runs `pnpm install && pnpm run build`, so a restored
      # cache would be overwritten anyway, and saving that very large tree
      # frequently hangs the runner on upload (observed: step stuck for
      # hours on "Post Cache harness build artifacts"). The SHA is pinned,
      # so the only cost is the ~21-min rebuild, which is within budget.

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('UPSTREAM.lock.json') }}
          restore-keys: |
            pnpm-store-

      - name: Build harness
        shell: pwsh
        run: pwsh desktop/scripts/build-harness.ps1 -HarnessDir ./deepseek-harness

      # ---- Tier 2 sidecar: pnpm deploy harness -> dsh-dist (self-contained node_modules) ----
      - name: "Bundle dsh sidecar (Tier 2: node.exe + node_modules)"
        shell: pwsh
        run: pwsh desktop/scripts/bundle-dsh.ps1 -HarnessDir ./deepseek-harness -OutDir ./dsh-dist

      # Frontend deps are pinned via the committed package-lock.json for reproducible builds.
      - name: npm ci (frontend deps)
        run: npm ci

      - name: Build frontend
        run: npm run build

      # 外部二进制（externalBin）随安装包分发。
      # 关键坑（已用 tauri-build 2.6.3 / tauri-utils 2.9.3 源码核实）：
      #   externalBin 条目经 tauri_utils::resources::external_binaries 仅生成裸文件名
      #   `node-x86_64-pc-windows-msvc.exe`（不含 binaries/ 前缀），随后 ResourcePaths
      #   把它当作【相对路径】按 build script 的 CWD（cargo 固定 = src-tauri crate 目录）
      #   做 exists() 校验。因此 tauri-build 实际检查的是 src-tauri/node-x86_64-pc-windows-msvc.exe，
      #   而非文档里写的 src-tauri/binaries/。
      # 修复：把 node sidecar 同时放到两个位置，覆盖任一约定，且不动 externalBin:["node"]
      # 与 sidecar("node") 的任何代码。复制后逐一 Test-Path 强校验。
      - name: Stage node.exe sidecar (verified, dual location)
        shell: pwsh
        run: |
          $node = (Get-Command node -ErrorAction Stop).Source
          if (-not (Test-Path $node)) { Write-Error "node executable not found at: $node"; exit 1 }
          $candidates = @(
            (Join-Path $PWD "src-tauri/node-x86_64-pc-windows-msvc.exe"),
            (Join-Path $PWD "src-tauri/binaries/node-x86_64-pc-windows-msvc.exe")
          )
          foreach ($dest in $candidates) {
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Copy-Item -Path $node -Destination $dest -Force
            if (-not (Test-Path $dest)) { Write-Error "failed to stage node sidecar at: $dest"; exit 1 }
            Write-Host "staged node sidecar: $dest ($([math]::Round((Get-Item $dest).Length/1MB,2)) MB)"
          }

      # 诊断增强（临时）：把 Tauri 构建的完整输出落盘，并在失败时把错误尾部作为
      # 单行 ::error:: 注解（用 %0A 表示换行，避免拆成多行丢失内容）回显，
      # 同时写入 step summary，使无 token 的环境也能通过 run 页面读到真实报错。
      - name: Tauri build
        id: tauri
        shell: pwsh
        run: |
          try {
            $p = Start-Process -NoNewWindow -FilePath "npm" -ArgumentList "run","tauri","build" `
              -RedirectStandardOutput "/d/wb/tauri_stdout.log" -RedirectStandardError "/d/wb/tauri_stderr.log" -PassThru
            $p.WaitForExit()
            $code = $p.ExitCode
            $out = (Get-Content "/d/wb/tauri_stdout.log" -Raw -ErrorAction SilentlyContinue)
            $err = (Get-Content "/d/wb/tauri_stderr.log" -Raw -ErrorAction SilentlyContinue)
            $log = "$out`n$err"
            Write-Host $log
            if ($code -ne 0) {
              $tail = (($log -split "`n") | Where-Object { $_.Trim() -ne "" } | Select-Object -Last 50) -join "%0A"
              Write-Output ("::error::TAURI BUILD FAILED (exit {0})%0A{1}" -f $code, $tail)
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("## Tauri build failed (exit {0})`n`n``````n{1}`n`n`````" -f $code, ($tail -replace "%0A", "`n"))
              # 标记文件：供后续 Push build logs 步骤判断（避免依赖 steps.<id>.outcome 的条件不确定性）。
              New-Item -ItemType File -Force -Path "/d/wb/BUILD_FAILED" | Out-Null
            }
            exit $code
          } catch {
            Write-Output "::error::TAURI BUILD STEP ERROR: $_"
            exit 1
          }

      # 诊断：Tauri build 失败时，把完整日志推送到 ci-debug-logs 分支（该分支不在
      # on.push.branches 内，不会重新触发本 workflow；另含 [skip ci] 双保险）。
      # 这样无 token 的本地环境也能用 `git fetch origin ci-debug-logs` 直接读到真实 cargo 报错。
      # 用 always() + BUILD_FAILED 标记判断，避免依赖 steps.<id>.outcome 的条件不确定性。
      - name: Push build logs on failure
        if: ${{ always() }}
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path "D:\wb\BUILD_FAILED")) {
            Write-Host "build did not fail (no BUILD_FAILED marker) — skipping log push"
            exit 0
          }
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mmllemon/deepseek-harness-desktop.git"
          New-Item -ItemType Directory -Force -Path ci-debug | Out-Null
          $maxLines = 4000
          if (Test-Path "D:\wb\tauri_stderr.log") {
            $lines = Get-Content "D:\wb\tauri_stderr.log" -Tail $maxLines
            $lines | Set-Content "ci-debug/tauri_stderr.log"
            ($lines | Where-Object { $_ -match 'error' } | Select-Object -Last 300) -join "`n" | Set-Content "ci-debug/error-extract.txt"
          } else {
            "NO D:\wb\tauri_stderr.log found" | Set-Content "ci-debug/error-extract.txt"
          }
          if (Test-Path "D:\wb\tauri_stdout.log") {
            (Get-Content "D:\wb\tauri_stdout.log" -Tail 1500) | Set-Content "ci-debug/tauri_stdout.log"
          }
          git config user.email "ci-debug@users.noreply.github.com"
          git config user.name "ci-debug"
          git add ci-debug/
          git commit -m "ci: debug build logs [skip ci]"
          git push origin HEAD:ci-debug-logs

      # ---- code signing (placeholder) ----
      # 生产环境推荐使用 Azure Trusted Signing 或自签证书 + signtool。
      # - name: Azure Trusted Signing
      #   uses: azure/trusted-signing-action@v0
      #   with:
      #     endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      #     trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
      #     certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
      #     files: |
      #       src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

      - name: Smoke test (section 12.6 acceptance gate)
        shell: pwsh
        run: pwsh desktop/scripts/smoke.ps1 -EntryPath ./dsh-dist/lib/bin.js
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Stage installer into workspace (build ran on D:\wb)
        if: ${{ always() && steps.tauri.outcome == 'success' }}
        shell: pwsh
        run: |
          $src = "D:\wb\src-tauri\target\release\bundle"
          $dst = "$env:GITHUB_WORKSPACE\src-tauri\target\release\bundle"
          if (-not (Test-Path $src)) {
            # fallback: also try the host-triple subdir
            $src = "D:\wb\src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          }
          Write-Host "staging from $src -> $dst"
          if (Test-Path $src) {
            # robocopy returns 0-7 on success, 8+ on error. Absorb the success
            # code so PowerShell does not propagate it as a non-zero step exit.
            robocopy $src $dst /E /NFL /NDL /NJH /NJS | Out-Null
            $rc = $LASTEXITCODE
            if ($rc -ge 8) { throw "robocopy failed (exit $rc)" }
          } else {
            throw "no bundle dir found under D:\wb"
          }
          Get-ChildItem $dst -Recurse -Include *.exe,*.msi | ForEach-Object { Write-Host "  found: $($_.FullName)" }
          # Force a clean 0 exit; the deployable artifact is already uploaded.
          exit 0

      - name: Upload installer artifact
        if: ${{ always() && steps.tauri.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-desktop-windows
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
          if-no-files-found: error
